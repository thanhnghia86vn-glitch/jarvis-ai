<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - SUPREME COMMAND CENTER</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        body { background-color: #020617; color: #cbd5e1; font-family: 'Segoe UI', monospace; }
        .glass-panel { background: rgba(15, 23, 42, 0.8); backdrop-filter: blur(12px); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 16px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
        
        /* JARVIS CIRCLE ANIMATION */
        .jarvis-reactor {
            width: 120px; height: 120px; border-radius: 50%;
            background: radial-gradient(circle, #0ea5e9 0%, #020617 70%);
            box-shadow: 0 0 30px #0ea5e9;
            position: relative;
            display: flex; justify-content: center; align-items: center;
            animation: breathe 3s infinite ease-in-out;
            border: 2px solid rgba(14, 165, 233, 0.3);
        }
        .reactor-core { width: 80%; height: 80%; border-radius: 50%; border: 1px dashed #38bdf8; animation: spin 10s linear infinite; }
        
        @keyframes breathe { 0% { box-shadow: 0 0 20px #0ea5e9; transform: scale(0.95); } 50% { box-shadow: 0 0 50px #0ea5e9; transform: scale(1.05); } 100% { box-shadow: 0 0 20px #0ea5e9; transform: scale(0.95); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 15px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        .mic-active { background-color: #ef4444 !important; animation: pulse-red 1.5s infinite; color: white !important; }
        
        /* Scrollbar & Table */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
        table tbody tr:hover { background-color: rgba(59, 130, 246, 0.1); cursor: pointer; transition: all 0.2s; }
    </style>
</head>
<body class="min-h-screen bg-[url('https://wallpapers.com/images/hd/hud-background-images-21z04576x3058866.jpg')] bg-cover bg-fixed bg-no-repeat">
    <div class="absolute inset-0 bg-slate-950/90 z-0"></div>

    <div class="relative z-10 container mx-auto max-w-7xl p-4 h-screen flex flex-col">
        
        <div class="flex justify-between items-center mb-6 border-b border-slate-800 pb-4">
            <div class="flex items-center gap-4">
                <div class="w-3 h-3 bg-green-500 rounded-full animate-pulse shadow-[0_0_10px_#22c55e]"></div>
                <h1 class="text-2xl font-bold text-white tracking-[0.2em] uppercase">J.A.R.V.I.S <span class="text-blue-500">OPERATIONS</span></h1>
            </div>
            <div id="connection-status" class="text-xs font-mono text-slate-500 bg-slate-900 px-3 py-1 rounded border border-slate-700">CONNECTING...</div>
        </div>

        <div class="flex flex-1 gap-6 overflow-hidden">
            
            <div class="w-1/3 flex flex-col gap-4">
                
                <div class="glass-panel p-6 flex flex-col items-center justify-center relative min-h-[300px]">
                    <div class="jarvis-reactor mb-6">
                        <div class="reactor-core"></div>
                    </div>
                    
                    <div id="visualizer" class="h-8 flex items-end gap-1 opacity-0 transition-opacity duration-300">
                        <div class="w-1 bg-blue-400 animate-[bounce_1s_infinite] h-4"></div>
                        <div class="w-1 bg-blue-300 animate-[bounce_1.2s_infinite] h-8"></div>
                        <div class="w-1 bg-blue-200 animate-[bounce_0.8s_infinite] h-6"></div>
                        <div class="w-1 bg-blue-300 animate-[bounce_1.5s_infinite] h-8"></div>
                        <div class="w-1 bg-blue-400 animate-[bounce_1.1s_infinite] h-4"></div>
                    </div>

                    <div id="ai-status-text" class="mt-4 text-center text-blue-300 text-sm font-mono typewriter">Hệ thống đang chờ lệnh...</div>
                </div>

                <div class="glass-panel flex-1 flex flex-col p-4">
                    <div id="chat-box" class="flex-1 overflow-y-auto space-y-3 mb-4 pr-2 text-sm font-mono">
                        <div class="text-slate-500 text-center text-xs italic">--- Bắt đầu phiên làm việc ---</div>
                    </div>
                    
                    <div class="flex gap-2">
                        <button id="mic-btn" class="w-12 h-12 rounded-full bg-slate-700 hover:bg-slate-600 text-blue-400 transition-all shadow-lg border border-slate-600">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <input type="text" id="user-input" class="flex-1 bg-slate-900/50 border border-slate-700 rounded-full px-4 text-white focus:border-blue-500 focus:outline-none transition" placeholder="Ra lệnh cho hệ thống...">
                        <button id="send-btn" class="w-12 h-12 rounded-full bg-blue-600 hover:bg-blue-500 text-white transition-all shadow-lg">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>

                <div class="grid grid-cols-2 gap-2">
                    <div class="glass-panel p-3 text-center border-l-2 border-green-500">
                        <div class="text-xs text-slate-400">CHI PHÍ (COST)</div>
                        <div id="total-cost" class="text-lg font-bold text-white">$0.000</div>
                    </div>
                    <div class="glass-panel p-3 text-center border-l-2 border-purple-500">
                        <div class="text-xs text-slate-400">DI SẢN (LEGACY)</div>
                        <div id="legacy-count" class="text-lg font-bold text-white">0</div>
                    </div>
                </div>
            </div>

            <div class="w-2/3 flex flex-col glass-panel p-1">
                <div class="p-4 border-b border-slate-700/50 flex justify-between items-center bg-slate-800/30 rounded-t-xl">
                    <h2 class="font-bold text-white"><i class="fas fa-database text-blue-500 mr-2"></i>NHẬT KÝ HOẠT ĐỘNG</h2>
                    <button onclick="fetchData()" class="text-xs bg-slate-700 px-2 py-1 rounded hover:bg-slate-600"><i class="fas fa-sync"></i> Refresh</button>
                </div>
                
                <div class="flex-1 overflow-auto bg-slate-900/40">
                    <table class="w-full text-left text-xs text-slate-400">
                        <thead class="bg-slate-800 text-slate-200 sticky top-0">
                            <tr>
                                <th class="p-3">Time</th>
                                <th class="p-3">Agent</th>
                                <th class="p-3">Task</th>
                                <th class="p-3">Tool</th>
                                <th class="p-3 text-right">Cost</th>
                            </tr>
                        </thead>
                        <tbody id="audit-table-body" class="divide-y divide-slate-700/30">
                            </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 bg-black/90 z-50 flex items-center justify-center p-4 backdrop-blur-sm">
        <div class="bg-slate-900 border border-blue-500/30 w-full max-w-4xl h-[80vh] rounded-2xl flex flex-col shadow-[0_0_50px_rgba(59,130,246,0.2)]">
            <div class="p-4 border-b border-slate-700 flex justify-between items-center bg-slate-800/50 rounded-t-2xl">
                <h3 id="modal-title" class="text-xl font-bold text-white">Chi tiết</h3>
                <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-slate-400 hover:text-red-500 text-2xl">&times;</button>
            </div>
            <div id="modal-content" class="p-6 overflow-y-auto font-sans text-sm leading-relaxed text-slate-300"></div>
        </div>
    </div>

    <script>
        // --- CẤU HÌNH WEBSOCKET ---
        const protocol = window.location.protocol === 'https:' ? 'wss:' : 'ws:';
        // Tự động nhận diện host (Render hoặc Localhost)
        const wsUrl = `${protocol}//${window.location.host}/ws/nexus`;
        
        const ws = new WebSocket(wsUrl);
        const chatBox = document.getElementById('chat-box');
        const statusDiv = document.getElementById('connection-status');
        const visualizer = document.getElementById('visualizer');

        // 1. KẾT NỐI WS
        ws.onopen = () => {
            statusDiv.innerHTML = '<span class="text-green-400">● SYSTEM ONLINE</span>';
            addChat("SYSTEM", "J.A.R.V.I.S Protocol v15.0 initialized.");
        };
        ws.onclose = () => {
            statusDiv.innerHTML = '<span class="text-red-500">● DISCONNECTED</span>';
        };
        ws.onmessage = (event) => {
            const msg = event.data;
            addChat("AI", msg);
            // Hiệu ứng sóng âm khi AI trả lời
            visualizer.classList.remove('opacity-0');
            setTimeout(() => visualizer.classList.add('opacity-0'), 3000);
        };

        function addChat(role, text) {
            const div = document.createElement('div');
            if (role === 'AI') {
                div.className = "bg-blue-900/20 border border-blue-500/30 p-2 rounded-r-xl rounded-bl-xl mr-8 animate-[fadeIn_0.3s]";
                div.innerHTML = `<span class="text-blue-400 font-bold text-[10px] block mb-1">J.A.R.V.I.S</span>${marked.parse(text)}`;
            } else if (role === 'USER') {
                div.className = "bg-slate-700/50 p-2 rounded-l-xl rounded-br-xl ml-8 text-right animate-[fadeIn_0.3s]";
                div.innerHTML = `<span class="text-green-400 font-bold text-[10px] block mb-1">COMMANDER</span>${text}`;
            } else {
                div.className = "text-center text-slate-600 text-xs my-2";
                div.innerText = text;
            }
            chatBox.appendChild(div);
            chatBox.scrollTop = chatBox.scrollHeight;
        }

        // 2. GỬI TIN NHẮN
        function sendCommand() {
            const input = document.getElementById('user-input');
            const text = input.value.trim();
            if(text) {
                addChat("USER", text);
                ws.send(text);
                input.value = '';
            }
        }
        document.getElementById('send-btn').onclick = sendCommand;
        document.getElementById('user-input').onkeypress = (e) => { if(e.key === 'Enter') sendCommand(); };

        // 3. VOICE CONTROL
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(Recognition) {
            const recognition = new Recognition();
            recognition.lang = 'vi-VN';
            const micBtn = document.getElementById('mic-btn');

            micBtn.onclick = () => {
                micBtn.classList.toggle('mic-active');
                if(micBtn.classList.contains('mic-active')) recognition.start();
                else recognition.stop();
            };

            recognition.onstart = () => document.getElementById('user-input').placeholder = "Đang lắng nghe...";
            recognition.onend = () => {
                micBtn.classList.remove('mic-active');
                document.getElementById('user-input').placeholder = "Ra lệnh cho hệ thống...";
            };
            recognition.onresult = (e) => {
                const transcript = e.results[0][0].transcript;
                document.getElementById('user-input').value = transcript;
                sendCommand();
            };
        }

        // 4. LẤY DỮ LIỆU BẢNG & STATS
        let logsData = [];
        async function fetchData() {
            try {
                // Lấy Logs
                const res = await fetch('/api/costs');
                const data = await res.json();
                logsData = data;
                renderTable(data);
                
                // Lấy Wealth (Tài sản)
                const resW = await fetch('/api/wealth');
                const wealth = await resW.json();
                
                if(wealth.financial_report) {
                    document.getElementById('total-cost').innerText = `$${wealth.financial_report.total_cost_usd.toFixed(4)}`;
                    document.getElementById('legacy-count').innerText = wealth.intellectual_assets.LEGENDARY_MASTER_PLANS;
                }
            } catch(e) { console.error(e); }
        }

        function renderTable(data) {
            const tbody = document.getElementById('audit-table-body');
            tbody.innerHTML = data.map((item, idx) => `
                <tr onclick="showDetail(${idx})" class="group">
                    <td class="p-3 font-mono text-slate-500">${item.timestamp}</td>
                    <td class="p-3 font-bold text-white group-hover:text-blue-400">${item.agent || item.agent_name}</td>
                    <td class="p-3 truncate max-w-[150px]">${item.task || item.task_content}</td>
                    <td class="p-3"><span class="bg-slate-800 px-2 py-0.5 rounded text-[10px] border border-slate-600">${item.tool || item.tool_used}</span></td>
                    <td class="p-3 text-right text-red-400 font-mono">$${(item.cost_usd || item.cost || 0).toFixed(4)}</td>
                </tr>
            `).join('');
        }

        function showDetail(idx) {
            const item = logsData[idx];
            document.getElementById('modal-title').innerText = item.task || "Chi tiết";
            document.getElementById('modal-content').innerHTML = marked.parse(item.result || item.result_summary || "Không có nội dung");
            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Auto Run
        fetchData();
        setInterval(fetchData, 5000); // 5s cập nhật bảng 1 lần
    </script>
</body>
</html>
