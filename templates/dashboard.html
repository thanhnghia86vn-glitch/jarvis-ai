<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - SUPREME COMMAND CENTER v10.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap');
        body { 
            background-color: #020617; 
            color: #cbd5e1; 
            font-family: 'Roboto Mono', monospace; 
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { 
            background: rgba(15, 23, 42, 0.85); 
            backdrop-filter: blur(12px); 
            border: 1px solid rgba(59, 130, 246, 0.2); 
            border-radius: 12px;
        }
        
        /* Jarvis Core Reactor Animation */
        .jarvis-reactor {
            width: 70px; height: 70px; border-radius: 50%;
            background: radial-gradient(circle, #0ea5e9 0%, #020617 70%);
            box-shadow: 0 0 20px #0ea5e9;
            display: flex; justify-content: center; align-items: center;
            animation: breathe 4s infinite ease-in-out;
            border: 2px solid rgba(14, 165, 233, 0.3);
        }
        .reactor-core { width: 70%; height: 70%; border-radius: 50%; border: 2px dashed #38bdf8; animation: spin 10s linear infinite; }
        @keyframes breathe { 0%, 100% { box-shadow: 0 0 15px #0ea5e9; transform: scale(0.95); } 50% { box-shadow: 0 0 35px #0ea5e9; transform: scale(1.05); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .custom-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #0ea5e9 #020617; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
        
        .mic-active { background-color: #ef4444 !important; animation: pulse-red 1.5s infinite; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }

        /* Log Card Styles */
        .log-card { transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); }
        .log-card:hover { transform: translateX(5px); background: rgba(30, 41, 59, 0.8); }
    </style>
</head>
<body class="h-screen p-4 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072')] bg-cover bg-fixed">
    <div class="absolute inset-0 bg-slate-950/80 z-0"></div>

    <div class="relative z-10 h-full flex flex-col gap-4">
        <header class="flex justify-between items-center glass-panel p-4 border-b-2 border-blue-500/50 shadow-2xl">
            <div class="flex items-center gap-5">
                <div class="jarvis-reactor"> <div class="reactor-core"></div> </div>
                <div>
                    <h1 class="font-orbitron text-xl font-bold tracking-[0.2em] text-white">COMMANDER <span class="text-blue-500">v10.0</span></h1>
                    <div id="location-tag" class="text-[9px] text-blue-400 font-mono tracking-widest uppercase">SYNCING NEURAL LINK...</div>
                </div>
            </div>
            <div class="flex items-center gap-6">
                <button onclick="location.href='/audit'" class="text-[10px] font-bold text-yellow-500 border border-yellow-500/30 px-3 py-1.5 rounded hover:bg-yellow-500/10 transition">SỔ CÁI TÀI CHÍNH</button>
                <div id="connection-status" class="text-[10px] font-bold text-green-500 bg-slate-900 px-4 py-1.5 rounded border border-green-500/40 font-orbitron shadow-[0_0_10px_rgba(34,197,94,0.2)]">CORE_ONLINE</div>
            </div>
        </header>

        <main class="flex flex-1 gap-4 overflow-hidden">
            <div class="w-1/4 flex flex-col gap-4 h-full">
                <div class="glass-panel p-4 border-l-4 border-indigo-500">
                    <div class="flex justify-between items-center">
                        <h3 class="text-[10px] font-bold text-indigo-400 uppercase tracking-widest flex items-center gap-2">
                            <i class="fas fa-brain animate-pulse"></i> Neural Autopilot
                        </h3>
                        <label class="relative inline-flex items-center cursor-pointer">
                            <input type="checkbox" id="autoPilotToggle" onchange="toggleAutoPilot()" class="sr-only peer">
                            <div class="w-8 h-4 bg-slate-700 rounded-full peer peer-checked:bg-indigo-600 after:content-[''] after:absolute after:top-0.5 after:left-[2px] after:bg-white after:rounded-full after:h-3 after:w-3 after:transition-all peer-checked:after:translate-x-4"></div>
                        </label>
                    </div>
                </div>

                <div class="glass-panel p-5 border-t-2 border-cyan-500 flex flex-col gap-3">
                    <h3 class="text-[10px] font-bold text-cyan-400 uppercase tracking-widest flex justify-between">
                        <span><i class="fas fa-network-wired"></i> Node Dispatcher</span>
                        <span class="text-white opacity-50">v10 PRO</span>
                    </h3>
                    
                    <div class="flex gap-1">
                        <button onclick="setTaskType('RESEARCH')" id="btnTypeResearch" class="flex-1 text-[8px] py-2 border border-cyan-500/50 bg-cyan-500/20 rounded font-bold">NGHIÊN CỨU</button>
                        <button onclick="setTaskType('PRACTICE_CODE')" id="btnTypeProject" class="flex-1 text-[8px] py-2 border border-slate-700 rounded font-bold opacity-50">DỰ ÁN CODE</button>
                    </div>

                    <input type="text" id="subjectInput" class="w-full bg-slate-950/80 border border-slate-700 rounded p-2.5 text-xs text-white outline-none focus:border-cyan-400 transition" placeholder="Chủ đề kiến thức cần nạp...">
                    
                    <div class="grid grid-cols-2 gap-3">
                        <div class="bg-slate-950 p-2 rounded border border-slate-800">
                            <p class="text-[7px] text-slate-500 uppercase">Min_Reward</p>
                            <p id="minRewardDisplay" class="text-[10px] font-bold text-green-400">$0.05</p>
                        </div>
                        <div class="bg-slate-950 p-2 rounded border border-cyan-500/30">
                            <p class="text-[7px] text-cyan-500 uppercase">Incentive ($)</p>
                            <input type="number" id="rewardInput" step="0.01" value="0.05" class="bg-transparent text-[10px] font-bold text-white w-full outline-none">
                        </div>
                    </div>

                    <div class="flex gap-2">
                        <select id="taskNumInput" class="bg-slate-800 border border-slate-700 rounded text-[9px] p-2 text-white flex-1">
                            <option value="5">05 Steps</option>
                            <option value="15" selected>15 Steps</option>
                            <option value="50">50 Steps (Mega)</option>
                        </select>
                        <button onclick="distributeKnowledge()" id="btnDistribute" class="bg-cyan-600 hover:bg-cyan-500 text-[9px] font-bold px-4 py-2 rounded shadow-lg">PHÂN BỔ</button>
                    </div>
                </div>

                <div class="glass-panel p-4 flex-1 flex flex-col overflow-hidden border-t-2 border-orange-500">
                    <h3 class="text-[10px] font-bold text-orange-400 uppercase tracking-widest mb-3 flex justify-between">
                        <span>Satellite Nodes</span>
                        <span id="worker-count" class="text-white">0</span>
                    </h3>
                    <div id="worker-list" class="flex-1 custom-scroll space-y-2 pr-1"></div>
                </div>
            </div>

            <div class="flex-1 flex flex-col gap-4">
                <div class="glass-panel flex-1 flex flex-col p-5 overflow-hidden border-b-2 border-blue-500/30">
                    <div id="chat-box" class="flex-1 custom-scroll space-y-4 pr-3 text-sm mb-4"></div>
                    
                    <div class="flex gap-3 p-2.5 bg-slate-900/80 rounded-full border border-slate-700 shadow-2xl">
                        <button id="mic-btn" class="w-12 h-12 rounded-full bg-slate-800 text-blue-400 flex items-center justify-center hover:bg-slate-700 transition"><i class="fas fa-microphone"></i></button>
                        <input type="text" id="user-input" class="flex-1 bg-transparent px-4 text-xs text-white outline-none" placeholder="Nhập lệnh điều hành J.A.R.V.I.S Tầng 9...">
                        <button id="send-btn" class="w-12 h-12 rounded-full bg-blue-600 text-white flex items-center justify-center hover:bg-blue-500 transition shadow-lg"><i class="fas fa-paper-plane"></i></button>
                    </div>
                </div>
            </div>

            <div class="w-1/4 flex flex-col gap-4 h-full">
                <div class="grid grid-cols-2 gap-3">
                    <div class="glass-panel p-4 border-l-4 border-green-500 bg-green-950/5">
                        <p class="text-[8px] text-slate-500 uppercase font-bold">Total Cost</p>
                        <p id="total-cost" class="text-sm font-bold text-white font-orbitron">$0.0000</p>
                    </div>
                    <div class="glass-panel p-4 border-l-4 border-purple-500 bg-purple-950/5">
                        <p class="text-[8px] text-slate-500 uppercase font-bold">Legacy Assets</p>
                        <p id="legacy-count" class="text-sm font-bold text-white font-orbitron">0</p>
                    </div>
                </div>
                
                <div class="glass-panel p-3 h-44 border-t-2 border-emerald-500">
                    <canvas id="growthChart"></canvas>
                </div>

                <div class="glass-panel flex-1 flex flex-col overflow-hidden border-t-2 border-blue-400">
                    <div class="p-3 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center text-[10px] font-bold text-blue-300 uppercase">
                        Real-time Ledger
                    </div>
                    <div id="audit-table-body" class="flex-1 custom-scroll p-3 space-y-2 font-mono text-[9px]"></div>
                </div>
            </div>
        </main>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-8 backdrop-blur-2xl">
        <div class="glass-panel w-full max-w-5xl h-[85vh] flex flex-col overflow-hidden shadow-[0_0_100px_rgba(59,130,246,0.3)]">
            <div class="p-5 border-b border-slate-800 flex justify-between items-center text-blue-400 font-orbitron uppercase">
                <span id="modal-title">DECRYPTING_DATA_STREAM</span> 
                <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-3xl font-light hover:text-red-500 transition">&times;</button>
            </div>
            <div id="modal-content" class="p-12 custom-scroll text-sm text-slate-300 font-sans leading-loose"></div>
        </div>
    </div>

    <script>
        const ADMIN_KEY = 'ai_corp_secret_123';
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/nexus`);
        let logsCache = [];

        // 1. CLOCK & STATUS
        setInterval(() => {
            const now = new Date();
            document.getElementById('location-tag').innerText = `CLOCK: ${now.toLocaleTimeString('vi-VN')} | NODE: PHAN_THIET_CENTRAL | MODE: SOVEREIGN_AI`;
        }, 1000);

        // 2. TASK ENGINE
        let currentTaskType = 'RESEARCH';
        function setTaskType(type) {
            currentTaskType = type;
            const isRes = type === 'RESEARCH';
            document.getElementById('btnTypeResearch').style.opacity = isRes ? "1" : "0.5";
            document.getElementById('btnTypeProject').style.opacity = !isRes ? "1" : "0.5";
            const min = isRes ? 0.05 : 0.50;
            document.getElementById('minRewardDisplay').innerText = `$${min}`;
            document.getElementById('rewardInput').value = min;
        }

        async function distributeKnowledge() {
            const subject = document.getElementById('subjectInput').value;
            const num = document.getElementById('taskNumInput').value;
            const reward = document.getElementById('rewardInput').value;
            if(!subject) return alert("Vui lòng nhập chủ đề!");

            const btn = document.getElementById('btnDistribute');
            btn.disabled = true; btn.innerText = "DYNAMIZING...";

            try {
                const res = await fetch('/api/admin/auto_distribute_knowledge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': ADMIN_KEY },
                    body: JSON.stringify({ subject: subject, num_tasks: parseInt(num), reward_per_task: parseFloat(reward) })
                });
                const d = await res.json();
                if(d.status === 'success') {
                    addChat("AI", `🚀 **DỰ ÁN ĐÃ KHỞI CHẠY**\n- Quy mô: ${d.tasks_created} mắt xích\n- Ngân sách: $${(d.tasks_created * reward).toFixed(2)}\n- Chủ đề: *${subject.substring(0, 50)}...*`);
                    document.getElementById('subjectInput').value = '';
                }
            } catch(e) { console.error(e); }
            finally { btn.disabled = false; btn.innerText = "PHÂN BỔ"; }
        }

        // 3. CHART & DATA SYNC
        const growthChart = new Chart(document.getElementById('growthChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: '#10b981', tension: 0.4, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.05)', borderWidth: 1.5 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 8 } } } } }
        });

        async function syncPulse() {
            try {
                const [resLogs, resWealth, resWorkers] = await Promise.all([
                    fetch('/api/costs'), fetch('/api/wealth'), fetch('/api/admin/active_workers', { headers: {'x-api-key': ADMIN_KEY}})
                ]);
                const logs = await resLogs.json();
                const wealth = await resWealth.json();
                const workers = await resWorkers.json();

                logsCache = logs;

                // Render Logs (Bọc thép bộ lọc rác)
                document.getElementById('audit-table-body').innerHTML = logs.map((item, idx) => {
                    const result = item.result_summary || item.result || "";
                    const isProcessing = result.includes("📂") || result.includes("trích xuất") || result === "None" || result === "";
                    const displayResult = isProcessing 
                        ? `<span class="text-blue-400 animate-pulse italic">⚡ Processing...</span>`
                        : result.substring(0, 60).replace(/[#*`>]/g, '') + "...";
                    
                    return `
                        <div onclick="showDetail(${idx})" class="log-card p-3 glass-panel border-l-2 border-blue-500/30 cursor-pointer">
                            <div class="flex justify-between text-[7px] text-slate-500 mb-1">
                                <span>${item.timestamp}</span>
                                <span class="font-bold text-red-400">-$${(item.cost_usd || item.cost || 0).toFixed(6)}</span>
                            </div>
                            <div class="flex items-center gap-2 mb-1">
                                <span class="font-bold text-blue-400 uppercase">${item.agent}</span>
                                ${isProcessing ? '' : '<span class="text-[5px] bg-green-500/20 text-green-400 px-1 rounded">DONE</span>'}
                            </div>
                            <div class="text-[8px] text-slate-400 truncate">${item.task}</div>
                            <div class="mt-1">${displayResult}</div>
                        </div>
                    `;
                }).join('');

                // Update Wealth
                if(wealth.financial_report) {
                    const cost = wealth.financial_report.total_cost_usd;
                    document.getElementById('total-cost').innerText = `$${cost.toFixed(4)}`;
                    document.getElementById('legacy-count').innerText = (wealth.intellectual_assets.HIGH_QUALITY_SYNTHESIS || 0) + (wealth.intellectual_assets.LEGENDARY_MASTER_PLANS || 0);
                    
                    growthChart.data.labels.push(""); growthChart.data.datasets[0].data.push(cost);
                    if(growthChart.data.labels.length > 20) { growthChart.data.labels.shift(); growthChart.data.datasets[0].data.shift(); }
                    growthChart.update();
                }

                // Update Workers
                document.getElementById('worker-count').innerText = workers.length;
                document.getElementById('worker-list').innerHTML = workers.map(w => `
                    <div class="p-2 border border-slate-800 rounded flex justify-between bg-slate-900/50">
                        <div class="flex items-center gap-2 text-[8px]"><i class="fas fa-microchip text-orange-400 animate-pulse"></i><span>${w.worker_id}</span></div>
                        <span class="text-[7px] text-orange-500 font-bold">BUSY</span>
                    </div>`).join('');

            } catch(e) { console.error("Sync Pulse Failed", e); }
        }

        // 4. DETAIL MODAL & CHAT
        function showDetail(idx) {
            const item = logsCache[idx];
            if(!item) return;
            const res = item.result_summary || item.result || "";
            const content = (res.includes("📂") || res === "None") 
                ? "### ⚡ Tín hiệu đang được xử lý...\n\n> ⚠️ **THÔNG BÁO:** Dữ liệu đang được Đặc vụ trích xuất và mã hóa. Vui lòng quay lại sau nhịp Pulse."
                : res;
            
            document.getElementById('modal-title').innerText = item.task || "MISSION_INSIGHT";
            document.getElementById('modal-content').innerHTML = marked.parse(content);
            document.getElementById('detailModal').classList.remove('hidden');
        }

        function addChat(role, text) {
            const box = document.getElementById('chat-box');
            const div = document.createElement('div');
            div.className = role === 'AI' ? "bg-blue-900/10 border-l-2 border-blue-500 p-3 rounded-lg" : "bg-slate-800/40 p-3 rounded-lg ml-8 text-right";
            div.innerHTML = `<span class="text-[8px] font-bold block mb-1 text-blue-500 font-orbitron">${role === 'AI' ? 'JARVIS_CORE' : 'COMMANDER'}</span>
                             <div class="text-xs text-slate-300 leading-relaxed">${marked.parse(text)}</div>`;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        }

        // 5. BOOTSTRAP
        ws.onmessage = (e) => { try { const d = JSON.parse(e.data); addChat("AI", d.content); } catch { addChat("AI", e.data); } };
        document.getElementById('send-btn').onclick = () => { const i = document.getElementById('user-input'); if(i.value){ addChat("USER", i.value); ws.send(i.value); i.value=''; } };
        document.getElementById('user-input').onkeypress = (e) => { if(e.key==='Enter') document.getElementById('send-btn').click(); };

        syncPulse(); setInterval(syncPulse, 8000);
    </script>
</body>
</html>
