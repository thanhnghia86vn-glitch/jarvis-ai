<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - SUPREME COMMAND CENTER v7.3</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap');
        body { 
        background-color: #020617; 
        color: #cbd5e1; 
        font-family: 'Roboto Mono', monospace; 
        overflow-y: auto; /* Quan trọng cho mobile */
        -webkit-tap-highlight-color: transparent;
    }
        .mobile-touch-btn {
        min-height: 44px; /* Tiêu chuẩn Apple */
        display: flex;
        align-items: center;
        justify-content: center;
    }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { 
        background: rgba(15, 23, 42, 0.85); 
        backdrop-filter: blur(10px); 
        border: 1px solid rgba(59, 130, 246, 0.2); 
        margin-bottom: 0.5rem;
    }
        
        .jarvis-reactor {
            width: 80px; height: 80px; border-radius: 50%;
            background: radial-gradient(circle, #0ea5e9 0%, #020617 70%);
            box-shadow: 0 0 20px #0ea5e9;
            display: flex; justify-content: center; align-items: center;
            animation: breathe 4s infinite ease-in-out;
            border: 2px solid rgba(14, 165, 233, 0.2);
        }
        .reactor-core { width: 75%; height: 75%; border-radius: 50%; border: 2px dashed #38bdf8; animation: spin 15s linear infinite; }
        @keyframes breathe { 0%, 100% { box-shadow: 0 0 15px #0ea5e9; transform: scale(0.98); } 50% { box-shadow: 0 0 35px #0ea5e9; transform: scale(1.02); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        .custom-scroll { overflow-y: auto; scrollbar-width: thin; scrollbar-color: #0ea5e9 #020617; }
        .custom-scroll::-webkit-scrollbar { width: 4px; }
        .custom-scroll::-webkit-scrollbar-track { background: #020617; border-radius: 10px; }
        .custom-scroll::-webkit-scrollbar-thumb { background: #0ea5e9; border-radius: 10px; }
        
        .mic-active { background-color: #ef4444 !important; animation: pulse-red 1.5s infinite; color: white !important; }
        @keyframes pulse-red { 0% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0.7); } 70% { box-shadow: 0 0 0 10px rgba(239, 68, 68, 0); } 100% { box-shadow: 0 0 0 0 rgba(239, 68, 68, 0); } }
    </style>
</head>
<body class="h-screen p-4 bg-[url('https://images.unsplash.com/photo-1451187580459-43490279c0fa?q=80&w=2072')] bg-cover bg-fixed">
    <div class="absolute inset-0 bg-slate-950/5 z-0"></div>

    <div class="relative z-10 h-full flex flex-col gap-4">
        <header class="flex justify-between items-center glass-panel p-3 border-b-2 border-blue-500/50 shadow-lg">
            <div class="flex items-center gap-4">
                <div class="jarvis-reactor scale-75"> <div class="reactor-core"></div> </div>
                <div>
                    <h1 class="font-orbitron text-lg font-bold tracking-widest text-white">J.A.R.V.I.S <span class="text-blue-500 text-sm">GLOBAL_OPS_v7.3</span></h1>
                    <div id="location-tag" class="text-[8px] text-blue-400 font-mono tracking-widest uppercase animate-pulse">Synchronizing...</div>
                </div>
            </div>
            <div id="connection-status" class="text-[10px] font-bold text-green-500 bg-slate-900 px-4 py-1 rounded border border-green-900/50 font-orbitron">SIGNAL_ACTIVE</div>
        </header>

        <main class="flex flex-col lg:flex-row flex-1 gap-4 overflow-y-auto lg:overflow-hidden px-2">
    
            <div class="w-full lg:w-1/4 flex flex-col gap-3">
                <button onclick="togglePanel('left-panel')" class="lg:hidden glass-panel p-3 text-[10px] font-bold text-blue-400 flex justify-between items-center">
                    <span><i class="fas fa-bars mr-2"></i> BẢNG ĐIỀU KHIỂN HỆ THỐNG</span>
                    <i class="fas fa-chevron-down" id="icon-left-panel"></i>
                </button>

                <div id="left-panel" class="hidden lg:flex flex-col gap-3 transition-all duration-300">
                    <div class="glass-panel p-4 border-l-2 border-indigo-500 bg-indigo-950/10 shadow-lg">...</div>
                    </div>
            </div>

            <div class="w-full lg:w-1/2 flex flex-col gap-4 h-[600px] lg:h-full">
                <div class="glass-panel flex-1 flex flex-col p-4 overflow-hidden border-b-2 border-blue-500/30 shadow-2xl">
                    <div id="chat-box" class="flex-1 custom-scroll space-y-4 pr-2 font-mono text-sm mb-2"></div>
                    </div>
            </div>

            <div class="w-full lg:w-1/4 flex flex-col gap-4">
                <button onclick="togglePanel('right-panel')" class="lg:hidden glass-panel p-3 text-[10px] font-bold text-green-400 flex justify-between items-center">
                    <span><i class="fas fa-chart-line mr-2"></i> THỐNG KÊ CHIẾN DỊCH</span>
                    <i class="fas fa-chevron-down" id="icon-right-panel"></i>
                </button>

                <div id="right-panel" class="hidden lg:flex flex-col gap-4 transition-all duration-300">
                    <div class="grid grid-cols-2 gap-2">...</div>
                    </div>
            </div>
        </main>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 bg-slate-950/95 z-50 flex items-center justify-center p-8 backdrop-blur-xl">
        <div class="bg-slate-900 border border-blue-500/30 w-full max-w-5xl h-[85vh] rounded-xl flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center text-blue-400 font-orbitron uppercase tracking-widest">
                <span id="modal-title">Data_Insight_Decryption</span> <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-3xl font-light hover:text-red-500 transition-all">&times;</button>
            </div>
            <div id="modal-content" class="p-10 custom-scroll text-sm text-slate-300 font-sans leading-relaxed"></div>
        </div>
    </div>

    <script>
        const ADMIN_KEY = 'ai_corp_secret_123';
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/nexus`);
        let logsData = [];

        // 1. DYNAMIC SYSTEM CONTEXT
        function updateLocation() {
            const now = new Date();
            document.getElementById('location-tag').innerText = `Time: ${now.toLocaleTimeString('vi-VN')} ${now.toLocaleDateString('vi-VN')} | Mode: GLOBAL_OPS_ACTIVE`;
        }
        setInterval(updateLocation, 1000);

        // 2. GROWTH CHART
        const growthChart = new Chart(document.getElementById('growthChart').getContext('2d'), {
            type: 'line',
            data: { labels: [], datasets: [{ data: [], borderColor: '#10b981', tension: 0.4, fill: true, backgroundColor: 'rgba(16, 185, 129, 0.05)', borderWidth: 1 }] },
            options: { responsive: true, maintainAspectRatio: false, plugins: { legend: { display: false } }, scales: { x: { display: false }, y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 7 } } } } }
        });

        // 3. VOICE ENGINE
        async function playVoice(text) {
            try {
                const res = await fetch('/api/tts', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ text: text.substring(0, 500) })
                });
                if (res.ok) {
                    const blob = await res.blob();
                    new Audio(URL.createObjectURL(blob)).play();
                }
            } catch (e) { console.error("TTS_FAIL"); }
        }
        function togglePanel(panelId) {
            const panel = document.getElementById(panelId);
            const icon = document.getElementById('icon-' + panelId);
            
            if (panel.classList.contains('hidden')) {
                panel.classList.remove('hidden');
                icon.style.transform = 'rotate(180deg)';
            } else {
                panel.classList.add('hidden');
                icon.style.transform = 'rotate(0deg)';
            }
        }
        async function toggleAutoPilot() {
            const isActive = document.getElementById('autoPilotToggle').checked;
            const status = isActive ? "ON" : "OFF";
            try {
                await fetch('/api/admin/set_autopilot', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': ADMIN_KEY },
                    body: JSON.stringify({ status: status })
                });
                addChat("AI", `Hệ thống Autopilot đã chuyển sang trạng thái: **${status}**`);
            } catch (e) { console.error("Autopilot fail"); }
        }
        // 4. MISSION FUNCTIONS
        async function distributeKnowledge() {
            const subject = document.getElementById('subjectInput').value;
            const num = document.getElementById('taskNumInput').value;
            const btn = document.getElementById('btnDistribute');
            if(!subject) return;

            btn.innerText = "BÓC TÁCH...";
            btn.disabled = true;

            try {
                const res = await fetch('/api/admin/auto_distribute_knowledge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': ADMIN_KEY },
                    body: JSON.stringify({ 
                        subject: subject, 
                        num_tasks: parseInt(num),
                        reward_per_task: 0.05 // <--- FIX: GỬI NGÂN SÁCH ĐỊNH GIÁ $0.05
                    })
                });
                const d = await res.json();
                if(d.status==='success') {
                    addChat("AI", `Giám sát viên đã phân phối chủ đề **${subject}** thành ${d.tasks_created} mẩu tri thức với ngân sách dự chi $${(d.tasks_created * 0.05).toFixed(2)}.`);
                    document.getElementById('subjectInput').value = '';
                    fetchData();
                }
            } catch (e) { console.error(e); }
            finally { btn.innerText = "PHÂN BỔ"; btn.disabled = false; }
        }

        async function activateHunter() {
            const kw = document.getElementById('hunterKeyword').value;
            const status = document.getElementById('hunterStatus');
            const btn = document.getElementById('btnHunter');
            if(!kw) return;
            
            btn.innerText = "RADAR SCANNING...";
            status.innerHTML = '<span class="text-red-400 animate-pulse font-bold tracking-widest">📡 RADAR SCANNING GLOBAL FREELANCE...</span>';
            
            try {
                const res = await fetch('/api/admin/start_hunting', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': ADMIN_KEY },
                    body: JSON.stringify({ keyword: kw })
                });
                const d = await res.json();
                status.innerHTML = `<span class="text-green-500 font-bold uppercase tracking-tighter">✅ HARVESTED ${d.projects_hunted || 0} GLOBAL PROJECTS</span>`;
                addChat("AI", `Radar Hunter đã quét thành công tín hiệu dự án về **${kw}** và đang đưa vào Pipeline thực thi.`);
                fetchData();
            } catch (e) { status.innerText = "Radar Fail - Signal Lost"; }
            finally { btn.innerText = "QUÉT RADAR QUỐC TẾ"; }
        }

        async function startFullProject() {
            const req = prompt("Mô tả Siêu Dự Án (Architect Builder):");
            if(!req) return;
            addChat("AI", `Khởi động Pipeline Siêu Dự Án: **${req}**. Đang triệu tập thợ đào tinh nhuệ...`);
            fetch('/api/plan_project', {
                method: 'POST',
                headers: { 'Content-Type': 'application/json', 'x-api-key': ADMIN_KEY },
                body: JSON.stringify({ message: req, thread_id: "MEGA_" + Date.now() })
            });
        }

        // 5. DATA SYNC & CLICK LOGS
        async function fetchData() {
            try {
                const [resLogs, resWealth, resWorkers] = await Promise.all([
                    fetch('/api/costs'), fetch('/api/wealth'), fetch('/api/admin/active_workers', { headers: {'x-api-key': ADMIN_KEY}})
                ]);
                const logs = await resLogs.json();
                const wealth = await resWealth.json();
                const workers = await resWorkers.json();

                logsData = logs; // Lưu cache dữ liệu

                const auditBody = document.getElementById('audit-table-body');
        
                auditBody.innerHTML = logs.map((item, idx) => {
                    // 1. Logic phân tích trạng thái từ nội dung Task
                    const isApproved = item.task && item.task.includes("APPROVED");
                    const isRejected = item.task && item.task.includes("REJECTED");
                    
                    // 2. Định nghĩa màu sắc khung (Border) và chữ (Text)
                    let statusClass = "border-slate-800 text-slate-400"; // Mặc định
                    if (isApproved) statusClass = "border-green-500/50 bg-green-950/10 shadow-[0_0_10px_rgba(34,197,94,0.1)]";
                    if (isRejected) statusClass = "border-red-500/50 bg-red-950/10 shadow-[0_0_10px_rgba(239,68,68,0.1)]";

                    const agentColor = isApproved ? "text-green-400" : (isRejected ? "text-red-400" : "text-blue-300");

                    // 3. Trả về giao diện thẻ Log mới
                    return `
                        <div onclick="showDetail(${idx})" 
                            class="relative p-3 rounded border ${statusClass} hover:bg-slate-800/80 cursor-pointer transition-all active:scale-[0.96] mb-2 group">
                            
                            <div class="flex justify-between text-[7px] text-slate-500 mb-1">
                                <span class="font-mono">${item.timestamp}</span>
                                <span class="font-bold ${isApproved ? 'text-green-500' : 'text-slate-400'}">
                                    ${isApproved ? '+$' : '$'}${item.cost_usd.toFixed(4)}
                                </span>
                            </div>

                            <div class="flex items-center gap-2 mb-1">
                                <div class="text-[9px] font-bold ${agentColor} uppercase tracking-tighter">${item.agent}</div>
                                ${isApproved ? '<span class="text-[5px] bg-green-500/20 text-green-400 px-1 rounded border border-green-500/30 uppercase font-bold">Passed</span>' : ''}
                                ${isRejected ? '<span class="text-[5px] bg-red-500/20 text-red-400 px-1 rounded border border-red-500/30 uppercase font-bold">Failed</span>' : ''}
                            </div>

                            <div class="truncate text-[8px] italic text-slate-400 font-sans">${item.task}</div>
                            
                            <div class="absolute inset-0 z-10"></div>
                        </div>
                    `;
                }).join('');
                if(wealth.financial_report) {
                    const cost = wealth.financial_report.total_cost_usd;
                    document.getElementById('total-cost').innerText = `$${cost.toFixed(4)}`;
                    document.getElementById('legacy-count').innerText = 
                        (wealth.intellectual_assets.HIGH_QUALITY_SYNTHESIS || 0) + (wealth.intellectual_assets.LEGENDARY_MASTER_PLANS || 0);
                    
                    growthChart.data.labels.push(""); growthChart.data.datasets[0].data.push(cost);
                    if(growthChart.data.labels.length > 20) { growthChart.data.labels.shift(); growthChart.data.datasets[0].data.shift(); }
                    growthChart.update();
                }

                document.getElementById('worker-count').innerText = workers.length;
                document.getElementById('worker-list').innerHTML = workers.map(w => `
                    <div class="bg-blue-950/10 border border-slate-800 p-2 rounded flex items-center justify-between mb-1">
                        <div class="flex items-center gap-2"><i class="fas fa-microchip text-orange-500 text-[9px] animate-pulse"></i><div><p class="text-[8px] font-bold text-slate-200">${w.worker_id}</p><p class="text-[6px] text-slate-400 truncate w-24">${w.current_task || 'Waiting...'}</p></div></div>
                        <span class="text-[6px] text-orange-400 font-bold border border-orange-900 px-1 rounded uppercase tracking-tighter">Node_Busy</span>
                    </div>`).join('');
            } catch(e) { console.error("Global Sync Error:", e); }
        }

        // 6. MODAL & CHAT
        function showDetail(idx) {
            const item = logsData[idx];
            if(!item) return;
            const modal = document.getElementById('detailModal');
            document.getElementById('modal-title').innerText = item.task || item.task_content || "NHẬT KÝ CHI TIẾT";
            
            // Ưu tiên hiển thị Result (Nội dung thợ đào nộp)
            const rawContent = item.result || item.result_summary || "Hệ thống đang mã hóa dữ liệu, vui lòng đợi...";
            document.getElementById('modal-content').innerHTML = marked.parse(rawContent);
            modal.classList.remove('hidden');
        }

        function addChat(role, text) {
            const div = document.createElement('div');
            div.className = role === 'AI' ? "bg-blue-900/10 border-l-2 border-blue-500 p-3 rounded" : "bg-slate-800/40 p-3 rounded ml-6 text-right";
            div.innerHTML = `<span class="text-[7px] font-bold block mb-1 ${role === 'AI' ? 'text-blue-500' : 'text-green-500'} font-orbitron tracking-widest">${role === 'AI' ? 'JARVIS_CORE' : 'COMMANDER_SUPREME'}</span>
                             <div class="text-xs text-slate-300 leading-relaxed">${marked.parse(text)}</div>`;
            document.getElementById('chat-box').appendChild(div);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        ws.onmessage = (e) => { 
            try {
                const d = JSON.parse(e.data); 
                addChat("AI", d.content); 
                playVoice(d.content); 
                visualizer.classList.remove('opacity-0'); setTimeout(() => visualizer.classList.add('opacity-0'), 3000);
            } catch { 
                addChat("AI", e.data); 
                playVoice(e.data); 
            }
        };

        document.getElementById('send-btn').onclick = () => {
            const i = document.getElementById('user-input');
            if(i.value) { addChat("USER", i.value); ws.send(i.value); i.value = ''; }
        };
        document.getElementById('user-input').onkeypress = (e) => { if(e.key==='Enter') document.getElementById('send-btn').click(); };

        // 7. VOICE RECOGNITION (STT)
        const Recognition = window.SpeechRecognition || window.webkitSpeechRecognition;
        if(Recognition) {
            const rec = new Recognition(); rec.lang = 'vi-VN';
            document.getElementById('mic-btn').onclick = () => { rec.start(); document.getElementById('mic-btn').classList.add('mic-active'); };
            rec.onresult = (e) => { document.getElementById('user-input').value = e.results[0][0].transcript; document.getElementById('send-btn').click(); };
            rec.onend = () => { document.getElementById('mic-btn').classList.remove('mic-active'); };
        }

        fetchData(); setInterval(fetchData, 8000);
    </script>
</body>
</html>
