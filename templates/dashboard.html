<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>J.A.R.V.I.S - SUPREME COMMAND CENTER v6.0</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700&family=Roboto+Mono&display=swap');
        body { background-color: #020617; color: #cbd5e1; font-family: 'Roboto Mono', monospace; overflow: hidden; }
        .font-orbitron { font-family: 'Orbitron', sans-serif; }
        .glass-panel { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(15px); border: 1px solid rgba(59, 130, 246, 0.2); border-radius: 12px; }
        
        /* REACTOR ANIMATION */
        .jarvis-reactor {
            width: 100px; height: 100px; border-radius: 50%;
            background: radial-gradient(circle, #0ea5e9 0%, #020617 70%);
            box-shadow: 0 0 25px #0ea5e9;
            display: flex; justify-content: center; align-items: center;
            animation: breathe 4s infinite ease-in-out;
            border: 2px solid rgba(14, 165, 233, 0.2);
        }
        .reactor-core { width: 75%; height: 75%; border-radius: 50%; border: 2px dashed #38bdf8; animation: spin 15s linear infinite; }
        
        @keyframes breathe { 0%, 100% { box-shadow: 0 0 15px #0ea5e9; transform: scale(0.98); } 50% { box-shadow: 0 0 40px #0ea5e9; transform: scale(1.02); } }
        @keyframes spin { 100% { transform: rotate(360deg); } }
        
        /* CUSTOM SCROLL */
        ::-webkit-scrollbar { width: 3px; }
        ::-webkit-scrollbar-track { background: #020617; }
        ::-webkit-scrollbar-thumb { background: #0ea5e9; }
        .custom-scroll { overflow-y: auto; scrollbar-width: thin; }

        .status-glow { animation: glow 2s infinite alternate; }
        @keyframes glow { from { opacity: 0.5; } to { opacity: 1; text-shadow: 0 0 10px #0ea5e9; } }
    </style>
</head>
<body class="h-screen p-4 bg-[url('https://images.unsplash.com/photo-1534796636912-3b95b3ab5986?auto=format&fit=crop&w=2000')] bg-cover bg-fixed">
    <div class="absolute inset-0 bg-slate-950/95 z-0"></div>

    <div class="relative z-10 h-full flex flex-col gap-4">
        
        <header class="flex justify-between items-center glass-panel p-3 border-b-2 border-blue-500/50">
            <div class="flex items-center gap-4">
                <div class="jarvis-reactor scale-50 -m-8"> <div class="reactor-core"></div> </div>
                <h1 class="font-orbitron text-xl font-bold tracking-widest text-white">J.A.R.V.I.S <span class="text-blue-500">SUPREME CMD</span></h1>
            </div>
            <div class="flex gap-6 text-[10px] font-mono">
                <div class="text-right">
                    <p class="text-slate-500">SYSTEM_TIME</p>
                    <p id="clock" class="text-blue-400 font-bold">00:00:00</p>
                </div>
                <div class="text-right border-l border-slate-700 pl-6">
                    <p class="text-slate-500">CONNECTION_STATUS</p>
                    <p id="connection-status" class="text-green-500 font-bold animate-pulse">ESTABLISHED</p>
                </div>
            </div>
        </header>

        <main class="flex flex-1 gap-4 overflow-hidden">
            
            <div class="w-1/4 flex flex-col gap-4">
                
                <div class="glass-panel p-4 border-t-2 border-blue-500">
                    <h3 class="text-[10px] font-bold text-blue-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                        <i class="fas fa-brain"></i> AI Supervisor
                    </h3>
                    <input type="text" id="subjectInput" class="w-full bg-slate-900 border border-slate-700 rounded p-2 text-xs text-white mb-2 outline-none focus:border-blue-500" placeholder="Chủ đề bóc tách kiến thức...">
                    <div class="flex gap-2">
                        <select id="taskNumInput" class="bg-slate-800 border border-slate-700 rounded text-[9px] p-1 text-white flex-1 outline-none">
                            <option value="5">05 Tasks</option>
                            <option value="10" selected>10 Tasks</option>
                        </select>
                        <button onclick="distributeKnowledge()" id="btnDistribute" class="bg-blue-600 hover:bg-blue-500 text-[9px] font-bold px-3 py-1 rounded transition-all">PHÂN BỔ</button>
                    </div>
                    <div id="statusBox" class="text-[8px] text-slate-500 mt-2 italic">--- Waiting for subject ---</div>
                </div>

                <div class="glass-panel p-4 flex-1 flex flex-col overflow-hidden border-t-2 border-orange-500">
                    <div class="flex justify-between items-center mb-2">
                        <h3 class="text-[10px] font-bold text-orange-400 uppercase tracking-widest flex items-center gap-2">
                            <i class="fas fa-network-wired"></i> Worker Network
                        </h3>
                        <span id="worker-count" class="text-[9px] bg-orange-950 text-orange-400 px-2 rounded">0 Nodes</span>
                    </div>
                    <div id="worker-list" class="flex-1 custom-scroll space-y-2">
                        </div>
                </div>

                <div class="glass-panel p-4 h-48 border-t-2 border-emerald-500">
                    <h3 class="text-[10px] font-bold text-emerald-400 uppercase tracking-widest mb-2">Growth Analysis</h3>
                    <canvas id="growthChart"></canvas>
                </div>
            </div>

            <div class="w-1/2 flex flex-col gap-4">
                <div class="glass-panel flex-1 flex flex-col p-4 overflow-hidden border-b-2 border-blue-500/30">
                    <div id="chat-box" class="flex-1 custom-scroll space-y-4 pr-2">
                        <div class="text-[10px] text-slate-600 text-center uppercase tracking-[0.5em]">--- Secure Protocol Active ---</div>
                    </div>
                    <div class="mt-4 flex gap-2">
                        <button id="mic-btn" class="w-10 h-10 rounded bg-slate-800 border border-slate-700 text-blue-400 hover:bg-slate-700">
                            <i class="fas fa-microphone"></i>
                        </button>
                        <input type="text" id="user-input" class="flex-1 bg-slate-900 border border-slate-700 rounded px-4 text-xs text-white outline-none focus:border-blue-500" placeholder="Enter Command...">
                        <button id="send-btn" class="w-10 h-10 rounded bg-blue-600 text-white hover:bg-blue-500">
                            <i class="fas fa-paper-plane"></i>
                        </button>
                    </div>
                </div>
            </div>

            <div class="w-1/4 flex flex-col gap-4">
                <div class="grid grid-cols-2 gap-2">
                    <div class="glass-panel p-4 border-l-4 border-green-500">
                        <p class="text-[8px] text-slate-500 uppercase">Operating Cost</p>
                        <p id="total-cost" class="text-lg font-bold text-white font-orbitron">$0.0000</p>
                    </div>
                    <div class="glass-panel p-4 border-l-4 border-purple-500">
                        <p class="text-[8px] text-slate-500 uppercase">Knowledge Base</p>
                        <p id="legacy-count" class="text-lg font-bold text-white font-orbitron">0</p>
                    </div>
                </div>

                <div class="glass-panel flex-1 flex flex-col overflow-hidden">
                    <div class="p-3 border-b border-slate-800 bg-slate-900/50 flex justify-between items-center">
                        <h3 class="text-[10px] font-bold uppercase tracking-tighter">Activity Log</h3>
                        <i class="fas fa-sync text-[10px] cursor-pointer hover:rotate-180 transition-all" onclick="fetchData()"></i>
                    </div>
                    <div id="audit-table-body" class="flex-1 custom-scroll text-[9px] p-2 space-y-2">
                        </div>
                </div>
            </div>
        </main>
    </div>

    <div id="detailModal" class="hidden fixed inset-0 bg-slate-950/90 z-50 flex items-center justify-center p-10 backdrop-blur-md">
        <div class="bg-slate-900 border border-blue-500/40 w-full max-w-4xl h-[80vh] rounded-lg flex flex-col overflow-hidden shadow-2xl">
            <div class="p-4 border-b border-slate-800 flex justify-between items-center">
                <h3 id="modal-title" class="font-orbitron text-blue-400 uppercase tracking-widest">Knowledge Packet</h3>
                <button onclick="document.getElementById('detailModal').classList.add('hidden')" class="text-2xl hover:text-red-500">&times;</button>
            </div>
            <div id="modal-content" class="p-8 custom-scroll text-sm leading-relaxed text-slate-300"></div>
        </div>
    </div>

    <script>
        // --- 1. INITIALIZE CHART ---
        const ctx = document.getElementById('growthChart').getContext('2d');
        const growthChart = new Chart(ctx, {
            type: 'line',
            data: {
                labels: [],
                datasets: [{
                    label: 'Earnings',
                    data: [],
                    borderColor: '#10b981',
                    borderWidth: 2,
                    tension: 0.4,
                    fill: true,
                    backgroundColor: 'rgba(16, 185, 129, 0.1)'
                }]
            },
            options: { 
                responsive: true, maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: { 
                    x: { display: false }, 
                    y: { grid: { color: '#1e293b' }, ticks: { color: '#64748b', font: { size: 8 } } } 
                }
            }
        });

        // --- 2. CORE LOGIC ---
        const ws = new WebSocket(`${window.location.protocol === 'https:' ? 'wss:' : 'ws:'}//${window.location.host}/ws/nexus`);
        let logsData = [];

        // Clock
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);

        // AI Supervisor
        async function distributeKnowledge() {
            const subject = document.getElementById('subjectInput').value;
            const numTasks = document.getElementById('taskNumInput').value;
            if(!subject) return;

            document.getElementById('btnDistribute').innerText = "BÓC TÁCH...";
            document.getElementById('statusBox').innerText = "JARVIS is thinking...";

            try {
                const res = await fetch('/api/admin/auto_distribute_knowledge', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json', 'x-api-key': 'ai_corp_secret_123' },
                    body: JSON.stringify({ subject: subject, num_tasks: parseInt(numTasks) })
                });
                const result = await res.json();
                if(result.status === 'success') {
                    document.getElementById('statusBox').innerHTML = `<span class="text-green-500">Nạp thành công ${result.tasks_created} Tasks</span>`;
                    addChat("AI", `Đã phân rã chủ đề: **${subject}**. Mạng lưới thợ đào đã nhận lệnh.`);
                }
            } catch (e) { document.getElementById('statusBox').innerText = "Connection Error"; }
            finally { document.getElementById('btnDistribute').innerText = "PHÂN BỔ"; }
        }

        // Fetch Data
        async function fetchData() {
            try {
                const [resLogs, resWealth, resWorkers] = await Promise.all([
                    fetch('/api/costs'), fetch('/api/wealth'), fetch('/api/admin/active_workers', { headers: {'x-api-key': 'ai_corp_secret_123'}})
                ]);
                
                const logs = await resLogs.json();
                const wealth = await resWealth.json();
                const workers = await resWorkers.json();

                // Update Logs
                logsData = logs;
                document.getElementById('audit-table-body').innerHTML = logs.map((item, idx) => `
                    <div onclick="showDetail(${idx})" class="bg-slate-900/50 p-2 rounded border border-slate-800 hover:border-blue-500/50 cursor-pointer transition-all">
                        <div class="flex justify-between text-slate-500 mb-1">
                            <span>${item.timestamp}</span>
                            <span class="text-green-500 font-bold">$${(item.cost_usd || item.cost || 0).toFixed(4)}</span>
                        </div>
                        <div class="text-slate-300 font-bold uppercase text-[8px]">${item.agent || item.agent_name}</div>
                        <div class="truncate text-slate-400">${item.task || item.task_content}</div>
                    </div>
                `).join('');

                // Update Wealth & Chart
                if(wealth.financial_report) {
                    const cost = wealth.financial_report.total_cost_usd;
                    document.getElementById('total-cost').innerText = `$${cost.toFixed(4)}`;
                    document.getElementById('legacy-count').innerText = wealth.intellectual_assets.HIGH_QUALITY_SYNTHESIS + wealth.intellectual_assets.LEGENDARY_MASTER_PLANS;
                    
                    // Chart update
                    growthChart.data.labels.push("");
                    growthChart.data.datasets[0].data.push(cost);
                    if(growthChart.data.labels.length > 20) { growthChart.data.labels.shift(); growthChart.data.datasets[0].data.shift(); }
                    growthChart.update();
                }

                // Update Workers
                document.getElementById('worker-count').innerText = `${workers.length} Nodes`;
                document.getElementById('worker-list').innerHTML = workers.map(w => `
                    <div class="bg-blue-950/20 border border-slate-800 p-2 rounded flex items-center justify-between">
                        <div class="flex items-center gap-2">
                            <i class="fas fa-microchip text-orange-500 animate-pulse text-[10px]"></i>
                            <div>
                                <p class="text-[9px] font-bold text-slate-200">${w.worker_id}</p>
                                <p class="text-[7px] text-slate-500 truncate w-32">${w.current_task || 'Idle'}</p>
                            </div>
                        </div>
                        <span class="text-[7px] text-orange-400 font-bold">BUSY</span>
                    </div>
                `).join('');

            } catch(e) { console.log("Sync failed"); }
        }

        function addChat(role, text) {
            const div = document.createElement('div');
            div.className = role === 'AI' ? "bg-blue-900/10 border-l-2 border-blue-500 p-3 rounded mr-6" : "bg-slate-800/40 p-3 rounded ml-6 text-right";
            div.innerHTML = `<span class="text-[8px] font-bold block mb-1 ${role === 'AI' ? 'text-blue-500' : 'text-green-500'}">${role === 'AI' ? 'SYSTEM_AI' : 'COMMANDER'}</span>
                             <div class="text-xs text-slate-300">${marked.parse(text)}</div>`;
            document.getElementById('chat-box').appendChild(div);
            document.getElementById('chat-box').scrollTop = document.getElementById('chat-box').scrollHeight;
        }

        ws.onmessage = (e) => { const d = JSON.parse(e.data); addChat("AI", d.content); };
        
        document.getElementById('send-btn').onclick = () => {
            const input = document.getElementById('user-input');
            if(input.value) { addChat("USER", input.value); ws.send(input.value); input.value = ''; }
        };

        function showDetail(idx) {
            const item = logsData[idx];
            document.getElementById('modal-title').innerText = item.task || "Log Details";
            document.getElementById('modal-content').innerHTML = marked.parse(item.result || item.result_summary || "NO DATA");
            document.getElementById('detailModal').classList.remove('hidden');
        }

        // Initialize
        fetchData();
        setInterval(fetchData, 10000);
    </script>
</body>
</html>
